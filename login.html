<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8fafc" id="meta-theme-color">
    <title>Acesso ao Extrato • Hugo Táxi</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        (function() {
            var tema = localStorage.getItem('tema_sistema_taxi') || 'light';
            document.documentElement.setAttribute('data-theme', tema);
        })();
    </script>

    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-yellow: #f59e0b;
            --accent-yellow-hover: #d97706;
            --accent-blue: #2563eb;
            --border-color: rgba(15, 23, 42, 0.1);
            --shadow-card: 0 18px 40px rgba(15, 23, 42, 0.08);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-yellow: #f59e0b;
            --accent-yellow-hover: #fbbf24;
            --accent-blue: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.09);
            --shadow-card: 0 20px 45px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .login-container {
            width: 100%;
            max-width: 410px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 26px;
            padding: 32px 26px;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:active {
            transform: scale(0.94);
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 26px;
        }

        .logo-box {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.16), rgba(37, 99, 235, 0.12));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .logo-box img {
            width: 66px;
            height: 66px;
            object-fit: contain;
            border-radius: 14px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.4px;
            margin: 0;
        }

        .login-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-label-custom {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 17px;
            pointer-events: none;
        }

        .form-control-modern {
            width: 100%;
            height: 48px;
            padding: 10px 14px 10px 42px;
            border-radius: 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .form-control-modern::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-control-modern:focus {
            outline: none;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .btn-entrar-modern {
            width: 100%;
            height: 50px;
            margin-top: 8px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
            transition: all 0.2s ease;
        }

        .btn-entrar-modern:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        .btn-entrar-modern:active {
            transform: scale(0.98);
        }

        .btn-entrar-modern:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <button type="button" class="theme-toggle-btn" id="btn-tema-login" title="Alternar Tema">
            <i class="bi bi-moon-stars" id="icone-tema-login"></i>
        </button>

        <div class="logo-area">
            <div class="logo-box">
                <img id="image_key" src="assets/logo2.png" alt="Hugo Táxi" onerror="this.style.display='none'; document.getElementById('taxi-icon-fallback').style.display='block';">
                <i class="bi bi-taxi-front-fill" id="taxi-icon-fallback" style="display: none; font-size: 38px; color: var(--accent-yellow);"></i>
            </div>
            <h1 class="login-title" id="title_login">Hugo Táxi</h1>
            <p class="login-subtitle" id="text_saudacao">Agradece a preferência! Acesse seu extrato abaixo.</p>
        </div>

        <form id="form-login" onsubmit="event.preventDefault(); verificarlogin();">
            <label class="form-label-custom" for="input_email">Nome do Cliente</label>
            <div class="input-wrapper">
                <i class="bi bi-person input-icon"></i>
                <input class="form-control-modern" id="input_email" placeholder="Digite seu nome" type="text" autocomplete="name">
            </div>

            <label class="form-label-custom" for="input_senha">Telefone / Código de Acesso</label>
            <div class="input-wrapper">
                <i class="bi bi-telephone input-icon"></i>
                <input class="form-control-modern" id="input_senha" placeholder="Digite seu telefone" type="tel" autocomplete="tel">
            </div>

            <button type="submit" class="btn-entrar-modern" id="button_entrar">
                <span>Acessar Extrato</span>
                <i class="bi bi-arrow-right-circle-fill"></i>
            </button>
        </form>

        <div class="footer-note">
            <i class="bi bi-shield-check text-success me-1"></i> Consulta rápida e segura de corridas
        </div>
    </div>

    <script>
        var bb_baserow_token = 'IKrER8jZ6NQENRIxVlNeF65L5J3ss1LH';
        var bb_baserow_url = 'https://api.baserow.io/';
        var tabelaidlogin = '177839';
        var tabelaidloginsenha = '1188493';
        var tabelaidcorridas = '177840';
        var tabelaidcorridacliente = '1188495';

        // Controle de Tema
        function aplicarTemaLogin(tema) {
            const icone = document.getElementById('icone-tema-login');
            const meta = document.getElementById('meta-theme-color');
            if (tema === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                icone.className = 'bi bi-sun-fill text-warning';
                meta.setAttribute('content', '#0f172a');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                icone.className = 'bi bi-moon-stars';
                meta.setAttribute('content', '#f1f5f9');
            }
        }

        aplicarTemaLogin(localStorage.getItem('tema_sistema_taxi') || 'light');

        document.getElementById('btn-tema-login').addEventListener('click', function () {
            const atual = document.documentElement.getAttribute('data-theme') || 'light';
            const proximo = atual === 'dark' ? 'light' : 'dark';
            localStorage.setItem('tema_sistema_taxi', proximo);
            localStorage.setItem('taxi_vca_tema_v1', proximo);
            aplicarTemaLogin(proximo);
        });

        function verificarlogin() {
            const email = document.getElementById('input_email').value.trim();
            const senha = document.getElementById('input_senha').value.trim();
            const btnEntrar = document.getElementById('button_entrar');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

            if (!email.length) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Atenção',
                    text: 'Preencha com o seu Nome!',
                    background: isDark ? '#1e293b' : '#ffffff',
                    color: isDark ? '#f8fafc' : '#0f172a'
                });
                return;
            }

            if (!senha.length) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Atenção',
                    text: 'Preencha com o seu Telefone!',
                    background: isDark ? '#1e293b' : '#ffffff',
                    color: isDark ? '#f8fafc' : '#0f172a'
                });
                return;
            }

            btnEntrar.disabled = true;
            btnEntrar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Verificando...';

            fetch(bb_baserow_url + "api/database/rows/table/" + tabelaidlogin + "/?user_field_names=true&filter__field_" + tabelaidloginsenha + "__equal=" + encodeURIComponent(senha) + "&order_by=+senha", {
                method: "GET",
                headers: {
                    "Authorization": "Token " + bb_baserow_token
                }
            })
            .then(response => response.json())
            .then(data => {
                const resultado_pesquisa = data.results || [];
                if (!resultado_pesquisa.length) {
                    btnEntrar.disabled = false;
                    btnEntrar.innerHTML = '<span>Acessar Extrato</span> <i class="bi bi-arrow-right-circle-fill"></i>';
                    Swal.fire({
                        icon: 'error',
                        title: 'Não encontrado',
                        text: 'Telefone/código não encontrado!',
                        background: isDark ? '#1e293b' : '#ffffff',
                        color: isDark ? '#f8fafc' : '#0f172a'
                    });
                } else {
                    const Item = resultado_pesquisa[0];
                    localStorage.setItem('usuarioindentificado', Item['nome']);
                    window.location.href = "extrato.html?enh";
                }
            })
            .catch((error) => {
                console.error("Error:", error);
                btnEntrar.disabled = false;
                btnEntrar.innerHTML = '<span>Acessar Extrato</span> <i class="bi bi-arrow-right-circle-fill"></i>';
                Swal.fire({
                    icon: 'error',
                    title: 'Erro de conexão',
                    text: 'Não foi possível verificar seus dados agora.',
                    background: isDark ? '#1e293b' : '#ffffff',
                    color: isDark ? '#f8fafc' : '#0f172a'
                });
            });
        }

        // Auto-login caso venha pelo link direto (?id=...)
        const idSalvo = localStorage.getItem('inicial');
        if (idSalvo && idSalvo !== '0' && idSalvo.trim() !== '') {
            document.getElementById('input_email').value = 'Automatico';
            document.getElementById('input_senha').value = idSalvo;
            verificarlogin();
        }
    </script>
</body>
</html>
